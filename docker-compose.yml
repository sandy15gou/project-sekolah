version: '3.8'

services:
  postgres-db:
    image: postgres:15-alpine
    container_name: postgres-container
    environment:
      POSTGRES_DB: project_sekolah
      POSTGRES_USER: sandy
      POSTGRES_PASSWORD: "015015"
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sandy -d project_sekolah"]
      interval: 10s
      timeout: 5s
      retries: 5

  spring-app:
    build: .
    container_name: spring-boot-container
    depends_on:
      postgres-db:
        condition: service_healthy
    ports:
      - "8003:8003"
    environment:
      SPRING_PROFILES_ACTIVE: development
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/project_sekolah
      SPRING_DATASOURCE_USERNAME: sandy
      SPRING_DATASOURCE_PASSWORD: "015015"

volumes:
  postgres-data: